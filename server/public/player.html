<!DOCTYPE html>
<html>
<head>
  <title>Questbound Player Card</title>
</head>
<body>
  <h1>Questbound Player Card</h1>

  <button onclick="loadPlayer()">Refresh Player</button>

  <pre id="output"></pre>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    async function showPlayer(player) {
        const itemRes = await fetch("/items");
        const allItems = await itemRes.json();

        const inventoryText = player.inventory && player.inventory.length > 0
            ? player.inventory.map(itemId => {
                const item = allItems.find(i => i.id === itemId);
                return item ? `${item.name} (${item.type})` : `Unknown Item (ID: ${itemId})`;
            }).join("\n")
            : "Empty";
      document.getElementById("output").textContent =
`Name: ${player.name}
Class: ${player.class}
Level: ${player.level}
HP: ${player.hp}

Inventory:
${inventoryText}`;
    }

    async function loadPlayer() {
      const res = await fetch("/players");
      const players = await res.json();
      const player = players.find(p => p.id === 1);

      await showPlayer(player);
    }

    socket.on("playersUpdated", async (players) => {
      const player = players.find(p => p.id === 1);

      await showPlayer(player);
    });

    loadPlayer();
  </script>
</body>
</html>
