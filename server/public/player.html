<!DOCTYPE html>
<html>
<head>
  <title>Questbound Player Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1>Questbound Player Card</h1>
  <p id="socketStatus">Socket not connected</p>

<h2>Request to Join Campaign</h2>
  <input id="joinName" placeholder="Player Name">
  <input id="joinClass" placeholder="Class">
  <button onclick="requestJoin()">Request to Join</button>
  <p id="joinStatus"></p>
<label>Select Campaign:</label>
<select id="campaignSelect" onchange="loadQuestBoard()"></select>

<br>

<label>Select Player:</label>
<select id="playerSelect"></select>
  <button onclick="loadPlayer()">Load Player</button>

  <button onclick="loadPlayer()">Refresh Player</button>

  <h2>Quest Board</h2>

<select id="questBoardSelect">
  <option>Loading quests...</option>
</select>

<button onclick="joinSelectedQuest()">Join Selected Quest</button>


  <pre id="output"></pre>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    socket.on("connect", () => {
      document.getElementById("socketStatus").textContent = "Socket connected";
    });

    let currentPlayerId = null

    async function requestJoin() {
      const joinRequest = {
        name: document.getElementById("joinName").value,
        class: document.getElementById("joinClass").value,
        campaignId: document.getElementById("campaignSelect").value
      };

      const res = await fetch("/requestjoin", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(joinRequest)
      });

      const data = await res.json();
      document.getElementById("joinStatus").textContent = data.message;
    }

    async function loadQuestBoard() {
  const selectedCampaignId =
    document.getElementById("campaignSelect").value;

  const questRes = await fetch("/quests");
  const quests = await questRes.json();

  const campaignRes = await fetch("/campaigns");
  const campaigns = await campaignRes.json();

  const joinableQuests = quests.filter(
    quest =>
      quest.campaignId === selectedCampaignId &&
      quest.joinable === true
  );

  const select = document.getElementById("questBoardSelect");
  select.innerHTML = "";

  joinableQuests.forEach(quest => {
    const campaign = campaigns.find(
      c => c.id === quest.campaignId
    );

    const option = document.createElement("option");
    option.value = quest.id;
    option.textContent =
      `${quest.title} | ${campaign ? campaign.name : quest.campaignId} | Reward: ${quest.reward}`;

    select.appendChild(option);
  });
}



    async function joinSelectedQuest() {
  const playerId = document.getElementById("playerSelect").value;
  const questId = document.getElementById("questBoardSelect").value;

  const res = await fetch("/joinquest", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      playerId: playerId,
      questId: questId
    })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadPlayer();
}


    async function showPlayer(player) {
  const itemRes = await fetch("/items");
  const allItems = await itemRes.json();

  const questRes = await fetch("/quests");
  const allQuests = await questRes.json();

  const inventoryText =
    player.inventory && player.inventory.length > 0
      ? player.inventory.map(itemId => {
          const item = allItems.find(i => i.id === itemId);
          return item ? `${item.name} (${item.type})` : itemId;
        }).join("\n")
      : "Empty";

  const activeQuestsText =
    player.activeQuests && player.activeQuests.length > 0
      ? player.activeQuests.map(questId => {
          const quest = allQuests.find(q => q.id === questId);
          return quest
            ? `${quest.title}
              Description: ${quest.description}
              Reward: ${quest.reward}
              XP: ${quest.xpReward}`
            : questId;
        }).join("\n")
      : "No active quests";
      
  const completedQuestsText =
    player.completedQuests && player.completedQuests.length > 0
    ? player.completedQuests.map(questId => {
        const quest = allQuests.find(q => q.id === questId);
        return quest
          ? `${quest.title}
          Description: ${quest.description}
          Reward: ${quest.reward}
          XP: ${quest.xpReward}`
          : questId;
      }).join("\n")
    : "No completed quests";
    
    const rewardsText =
  player.completedQuests && player.completedQuests.length > 0
    ? player.completedQuests.map(questId => {
        const quest = allQuests.find(q => q.id === questId);
        return quest
          ? `${quest.title}: ${quest.reward}`
          : questId;
      }).join("\n")
    : "No rewards earned yet";
    
    const statsText =
  player.stats
    ? Object.entries(player.stats)
        .map(([stat, value]) => `${stat}: ${value}`)
        .join("\n")
    : "No stats";

  document.getElementById("output").textContent =
      `Name: ${player.name}
      Class: ${player.class}
      Level: ${player.level}
      HP: ${player.hp}

      Stats:
      ${statsText}
      
      Inventory:
      ${inventoryText}

      Active Quests:
      ${activeQuestsText}

      Completed Quests:
      ${completedQuestsText}

      Rewards Earned:
      ${rewardsText}`;
}

    async function loadPlayer() {
      const res = await fetch("/players");
      const players = await res.json();
      currentPlayerId = Number(document.getElementById("playerSelect").value)
      const player = players.find(p => p.id === currentPlayerId);

      await showPlayer(player);
      await loadQuestBoard();
    }

    socket.on("playersUpdated", async (players) => {
      document.getElementById("socketStatus").textContent = "Live update received";

  await loadPlayerList();

  if (!currentPlayerId) return;

  const player = players.find(p => p.id === currentPlayerId);

  if (!player) {
    currentPlayerId = null;

    document.getElementById("output").textContent =
      "This character was removed from the campaign.";

    return;
  }

  await showPlayer(player);
  await loadQuestBoard();
});


    async function loadPlayerList() {
  const res = await fetch("/players");
  const players = await res.json();

  document.getElementById("socketStatus").textContent =
  "Socket connected | Players loaded: " + players.length;
  const select = document.getElementById("playerSelect");
  select.innerHTML = "";

  players.forEach(player => {
    const option = document.createElement("option");
    option.value = player.id;
    option.textContent = `${player.name} (${player.class})`;
    select.appendChild(option);
  });
}

    async function loadCampaigns() {
  const res = await fetch("/campaigns");
  const campaigns = await res.json();

  const campaignSelect = document.getElementById("campaignSelect");
  campaignSelect.innerHTML = "";

  campaigns.forEach(campaign => {
    const option = document.createElement("option");
    option.value = campaign.id;
    option.textContent = campaign.name;
    campaignSelect.appendChild(option);
  });
}


    loadPlayerList();
    loadCampaigns().then(() => {
      loadQuestBoard();
    });
    
  </script>
</body>
</html>
