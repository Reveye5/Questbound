<!DOCTYPE html>
<html>
<head>
  <title>Questbound DM Dashboard</title>
</head>
<body>
  <h1>Questbound DM Dashboard</h1>

 <button onclick="damagePlayer()">Damage Selected Player -5 HP</button>
<button onclick="healPlayer()">Heal Selected Player +5 HP</button>
<button onclick="loadPlayers()">View All Players</button>

<h2>DM Check Roll</h2>

<select id="dmCheckType">
  <option value="strength">Strength</option>
  <option value="dexterity">Dexterity</option>
  <option value="intelligence">Intelligence</option>
  <option value="wisdom">Wisdom</option>
  <option value="charisma">Charisma</option>
  <option value="constitution">Constitution</option>
  <option value="stealth">Stealth</option>
</select>

<input id="dmCheckDifficulty" type="number" value="10">

<button onclick="dmRollCheck()">Roll Check For Selected Player</button>

<h2>Dice Roller</h2>

<input id="diceAmount" type="number" min="1" value="1">

<select id="diceSides">
  <option value="4">d4</option>
  <option value="6">d6</option>
  <option value="8">d8</option>
  <option value="10">d10</option>
  <option value="12">d12</option>
  <option value="20" selected>d20</option>
  <option value="100">d100</option>
</select>

<button onclick="rollSelectedDice()">Roll Dice</button>

<button onclick="rollAndDamageSelectedPlayer()">
  Roll Damage Against Selected Player
</button>

<h2>Action Roller</h2>

<input id="actionDiceAmount" type="number" min="1" value="1">

<select id="actionDiceSides">
  <option value="4">d4</option>
  <option value="6">d6</option>
  <option value="8">d8</option>
  <option value="10">d10</option>
  <option value="12">d12</option>
  <option value="20" selected>d20</option>
  <option value="100">d100</option>
</select>

<select id="rollActionType">
  <option value="roll">Roll Only</option>
  <option value="damage">Damage Selected Player</option>
  <option value="heal">Heal Selected Player</option>
</select>

<button onclick="rollActionDice()">Roll Action</button>

<h2>Campaign Control</h2>

<select id="dmCampaignSelect"
onchange="campaignChanged()">
  <option>Loading campaigns...</option>
</select>

  <h2>Player Control</h2>

  <select id="playerSelect" onchange="loadActiveQuestsForSelectedPlayer()">
    <option>Loading players...</option>
  </select>

  <button onclick="removeSelectedPlayer()">Remove Selected Player</button>
  
  <h2>Join Requests</h2>

  <button onclick="loadJoinRequests()">View Join Requests</button>
  <div id="joinRequests"></div>

<h2>Create Campaign</h2>

<input id="campaignName" placeholder="Campaign Name">
<input id="campaignDM" placeholder="DM Name">
<input id="campaignDescription" placeholder="Description">

<button onclick="createCampaign()">Create Campaign</button>

<h2>Create Quest</h2>

<input id="questTitle" placeholder="Quest Title">
<input id="questDescription" placeholder="Quest Description">
<input id="questReward" placeholder="Quest Reward">
<input id="questXpReward" placeholder="XP Reward" type="number">
<label>Number of Objectives:</label>
<input id="objectiveCount" type="number" min="1" value="1">

<button onclick="generateObjectiveInputs()">
  Generate Objectives
</button>

<div id="objectiveInputs"></div>

<label>
  <input id="questJoinable" type="checkbox" checked>
  Player can join this quest
</label>

<button onclick="createQuest()">Create Quest</button>

<h2>Quest Control</h2>

<div style="display: flex; gap: 30px;">

  <div>
    <h3>Campaign Quests</h3>
    <select id="questSelect">
      <option>Loading quests...</option>
    </select>

    <br><br>

    <button onclick="assignSelectedQuest()">
      Assign/Join Selected Quest
    </button>

    <button onclick="deleteSelectedQuest()">
      Delete Selected Quest
    </button>
  </div>

  <div>
   <div>
  <h3>Selected Player Active Quests</h3>

  <select id="activeQuestSelect" onchange="loadObjectivesForSelectedQuest()">
    <option>Loading active quests...</option>
  </select>

  <br><br>

  <button onclick="completeSelectedQuest()">
    Complete Active Quest
  </button>

  <h3>Quest Objectives</h3>

  <select id="objectiveSelect">
    <option>Loading objectives...</option>
  </select>

  <br><br>

  <button onclick="completeSelectedObjective()">
    Complete Selected Objective
  </button>
</div>


  <h2>Item Control</h2>

  <select id="itemSelect">
    <option>Loading items...</option>
  </select>

  <h2>Create Custom Item </h2>

  <input id="ItemName" placeholder="Item Name">
  <input id="ItemType" placeholder="Type: Weapon, Potion, armor">
  <input id="ItemDescription" placeholder="Item Description">
  <input id="ItemDamage" placeholder="Damage" type="number">

  <button onclick="createCustomItem()">Create Custom Item</button>
  <button onclick="createNewItem()">Create Item</button>
  <button onclick="giveSelectedItem()">Give Selected Item</button>
  <button onclick="removeSelectedItem()">Remove Selected Item</button>

  <pre id="output"></pre>
  
  
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    socket.on("connect", () => {
      console.log("DM dashboard connected to server");
    });
    async function damagePlayer() {
      const playerId = document.getElementById("playerSelect").value;
      const res = await fetch(`/damage/${playerId}/5`);
      const data = await res.json();
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    }
    
    function generateObjectiveInputs() {
  const count = Number(document.getElementById("objectiveCount").value);
  const box = document.getElementById("objectiveInputs");

  box.innerHTML = "";

  for (let i = 1; i <= count; i++) {
    const input = document.createElement("input");
    input.id = `questObjective${i}`;
    input.placeholder = `Objective ${i}`;

    box.appendChild(input);
    box.appendChild(document.createElement("br"));
  }
}

async function dmRollCheck() {
  const playerId = document.getElementById("playerSelect").value;
  const checkType = document.getElementById("dmCheckType").value;
  const difficulty = document.getElementById("dmCheckDifficulty").value;

  const res = await fetch("/rollcheck", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      playerId,
      checkType,
      difficulty
    })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}

async function rollActionDice() {
  const playerId = document.getElementById("playerSelect").value;
  const amount = document.getElementById("actionDiceAmount").value;
  const sides = document.getElementById("actionDiceSides").value;
  const actionType = document.getElementById("rollActionType").value;

  const rollRes = await fetch("/rolldice", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ amount, sides })
  });

  const rollData = await rollRes.json();

  let actionResult = null;

  if (actionType === "damage") {
    const damageRes = await fetch(`/damage/${playerId}/${rollData.total}`);
    actionResult = await damageRes.json();
  }

  if (actionType === "heal") {
    const healRes = await fetch(`/heal/${playerId}/${rollData.total}`);
    actionResult = await healRes.json();
  }

  document.getElementById("output").textContent =
    JSON.stringify({
      actionType,
      roll: rollData,
      result: actionResult
    }, null, 2);

  await loadPlayerList();
}

async function rollSelectedDice() {
  const amount = document.getElementById("diceAmount").value;
  const sides = document.getElementById("diceSides").value;

  const res = await fetch("/rolldice", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      amount: amount,
      sides: sides
    })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}

async function rollAndDamageSelectedPlayer() {
  const playerId = document.getElementById("playerSelect").value;
  const amount = document.getElementById("diceAmount").value;
  const sides = document.getElementById("diceSides").value;

  const rollRes = await fetch("/rolldice", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      amount: amount,
      sides: sides
    })
  });

  const rollData = await rollRes.json();

  const damageRes = await fetch(`/damage/${playerId}/${rollData.total}`);
  const damageData = await damageRes.json();

  document.getElementById("output").textContent =
    JSON.stringify({
      roll: rollData,
      damageApplied: damageData
    }, null, 2);

  await loadPlayerList();
}

    async function completeSelectedObjective() {
  const questId = document.getElementById("activeQuestSelect").value;
  const objectiveId = document.getElementById("objectiveSelect").value;

  const res = await fetch("/completeobjective", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      questId: questId,
      objectiveId: objectiveId
    })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadObjectivesForSelectedQuest();
}

    async function loadObjectivesForSelectedQuest() {
  const questId = document.getElementById("activeQuestSelect").value;

  const questRes = await fetch("/quests");
  const quests = await questRes.json();

  const quest = quests.find(q => q.id === questId);

  const select = document.getElementById("objectiveSelect");
  select.innerHTML = "";

  if (!quest || !quest.objectives || quest.objectives.length === 0) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "No objectives";
    select.appendChild(option);
    return;
  }

  quest.objectives.forEach(objective => {
    const option = document.createElement("option");
    option.value = objective.id;
    option.textContent =
      `${objective.completed ? "✅" : "⬜"} ${objective.text}`;

    select.appendChild(option);
  });
}

    async function completeSelectedQuest() {
  const playerId = document.getElementById("playerSelect").value;
  const questId = document.getElementById("activeQuestSelect").value;

  const res = await fetch("/completequest", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      playerId: playerId,
      questId: questId
    })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadPlayerList();
}

    async function healPlayer() {
      const playerId = document.getElementById("playerSelect").value;
      const res = await fetch(`/heal/${playerId}/5`);
      const data = await res.json();
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    }

    async function loadPlayers() {
      const res = await fetch("/players");
      const data = await res.json();
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    }

    async function loadActiveQuestsForSelectedPlayer() {
  const playerId = Number(document.getElementById("playerSelect").value);

  const playerRes = await fetch("/players");
  const players = await playerRes.json();

  const questRes = await fetch("/quests");
  const quests = await questRes.json();

  const player = players.find(p => p.id === playerId);

  const select = document.getElementById("activeQuestSelect");
  select.innerHTML = "";

  if (!player || !player.activeQuests || player.activeQuests.length === 0) {
    const option = document.createElement("option");
    option.textContent = "No active quests";
    option.value = "";
    select.appendChild(option);
    return;
  }

  player.activeQuests.forEach(questId => {
    const quest = quests.find(q => q.id === questId);

    const option = document.createElement("option");
    option.value = questId;
    option.textContent = quest
      ? `${quest.title} - Reward: ${quest.reward}`
      : questId;

    select.appendChild(option);
  });
  await loadObjectivesForSelectedQuest();
}

    async function loadQuests() {

  const res = await fetch("/quests");
  const quests = await res.json();

  const selectedCampaignId =
    document.getElementById("dmCampaignSelect").value;

  const filteredQuests =
    quests.filter(
      quest => quest.campaignId === selectedCampaignId
    );

  const questSelect =
    document.getElementById("questSelect");

  questSelect.innerHTML = "";

  filteredQuests.forEach(quest => {

    const option =
      document.createElement("option");

    option.value = quest.id;

    option.textContent =
      `${quest.title} (${quest.status})`;

    questSelect.appendChild(option);

  });

}

async function deleteSelectedQuest() {
  const questId = document.getElementById("questSelect").value;

  const res = await fetch("/deletequest", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ questId: questId })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadQuests();
  await loadPlayerList();
}

    async function loadItems() {
  const res = await fetch("/items");
  const items = await res.json();

  const itemSelect = document.getElementById("itemSelect");
  itemSelect.innerHTML = "";

  items.forEach(item => {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = `${item.name} (${item.type})`;
    itemSelect.appendChild(option);
  });
}

async function assignSelectedQuest() {
  const playerId = document.getElementById("playerSelect").value;
  const questId = document.getElementById("questSelect").value;

  const res = await fetch("/assignquest", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      playerId: playerId,
      questId: questId
    })
    
  });

  await loadActiveQuestsForSelectedPlayer();

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadPlayerList();
}


async function createQuest() {
  const campaignId = document.getElementById("dmCampaignSelect").value;

  const objectiveCount = Number(document.getElementById("objectiveCount").value);
  const objectives = [];

  for (let i = 1; i <= objectiveCount; i++) {
    const objectiveInput = document.getElementById(`questObjective${i}`);

    if (objectiveInput && objectiveInput.value.trim() !== "") {
      objectives.push({
        id: `OBJ-${String(i).padStart(3, "0")}`,
        text: objectiveInput.value,
        completed: false
      });
    }
  }

  const newQuest = {
    campaignId: campaignId,
    title: document.getElementById("questTitle").value,
    description: document.getElementById("questDescription").value,
    reward: document.getElementById("questReward").value,
    xpReward: document.getElementById("questXpReward").value,
    joinable: document.getElementById("questJoinable").checked,
    objectives: objectives
  };

  const res = await fetch("/createquest", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(newQuest)
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadQuests();
}

async function campaignChanged() {
  await loadQuests();
  await loadPlayerList();
  await loadJoinRequests();
  await loadActiveQuestsForSelectedPlayer();
}

async function loadCampaigns() {
  const res = await fetch("/campaigns");
  const campaigns = await res.json();

  const select =
    document.getElementById("dmCampaignSelect");

  select.innerHTML = "";

  campaigns.forEach(campaign => {

    const option =
      document.createElement("option");

    option.value = campaign.id;

    option.textContent =
      `${campaign.name} - DM: ${campaign.dm}`;

    select.appendChild(option);
  });
  await campaignChanged();
}

async function giveSelectedItem() {
  const playerId = document.getElementById("playerSelect").value;
  const itemId = document.getElementById("itemSelect").value;

  const res = await fetch(`/giveitem/${playerId}/${itemId}`);
  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}

async function removeSelectedItem() {
  const playerId = document.getElementById("playerSelect").value;
  const itemId = document.getElementById("itemSelect").value;

  const res = await fetch(`/removeitem/${playerId}/${itemId}`);
  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}

async function loadPlayerList() {

    const res = await fetch("/players");

    const players = await res.json();
    const selectedCampaignId = document.getElementById("dmCampaignSelect").value;
    
    const filteredPlayers = players.filter(
      player => player.campaignId && player.campaignId === selectedCampaignId);

      console.log("Selected Campaign:", selectedCampaignId);
      console.log("All Players:", players);
      console.log("Filtered Players:", filteredPlayers,
      filteredPlayers);

    const playerSelect =
        document.getElementById("playerSelect");

    playerSelect.innerHTML = "";

    filteredPlayers.forEach(player => {

        const option =
            document.createElement("option");

        option.value = player.id;

        option.textContent =
            player.name;

        playerSelect.appendChild(option);

    });

    await loadActiveQuestsForSelectedPlayer();

}

async function createCustomItem() {
  const name = document.getElementById("ItemName").value;
  const type = document.getElementById("ItemType").value;
  const description = document.getElementById("ItemDescription").value;
  const damage = parseInt(document.getElementById("ItemDamage").value) || 0;
  const heal = parseInt(document.getElementById("ItemHeal").value) || 0;

  const res = await fetch("/createitem", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, type, description, damage, heal })
  });
  const data = await res.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
  await loadItems();
}

async function loadJoinRequests() {
  const res = await fetch("/joinrequests");
  const requests = await res.json();

  const selectedCampaignId = document.getElementById("dmCampaignSelect").value;

  const filteredRequests = requests.filter(r => r.campaignId === selectedCampaignId);

  const box = document.getElementById("joinRequests");
  box.innerHTML = "";

  filteredRequests.forEach(request => {
    const div = document.createElement("div");

    div.innerHTML = `
      <p>${request.name} - ${request.class}</p>
      <button onclick="approveJoin('${request.id}')">Approve</button>
      <button onclick="denyJoin('${request.id}')">Deny</button>
    `;

    box.appendChild(div);
  });
}

async function createCampaign() {
  const newCampaign = {
    name: document.getElementById("campaignName").value,
    dm: document.getElementById("campaignDM").value,
    description: document.getElementById("campaignDescription").value
  };

  const res = await fetch("/createcampaign", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(newCampaign)
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadCampaigns();
}

async function approveJoin(requestId) {
  const res = await fetch("/approvejoin", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ requestId: requestId })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadJoinRequests();
  await loadPlayerList();
}

async function denyJoin(requestId) {
  const res = await fetch("/denyjoin", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ requestId: requestId })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadJoinRequests();
}

async function removeSelectedPlayer() {
  const playerId = document.getElementById("playerSelect").value;

  const res = await fetch("/removeplayer", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ playerId: playerId })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadPlayerList();
}


loadItems();
loadCampaigns()
generateObjectiveInputs();

  </script>
</body>
</html>
