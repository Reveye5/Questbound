<!DOCTYPE html>
<html>
<head>
  <title>Questbound DM Dashboard</title>
</head>
<body>
  <h1>Questbound DM Dashboard</h1>

  <button onclick="damagePlayer()">Damage Louis -5 HP</button>
  <button onclick="healPlayer()">Heal Louis +5 HP</button>
  <button onclick="loadPlayers()">View Players</button>

  <h2>Player Control</h2>

  <select id="playerSelect">
    <option>Loading players...</option>
  </select>

  <button onclick="removeSelectedPlayer()">Remove Selected Player</button>
  
  <h2>Join Requests</h2>

  <button onclick="loadJoinRequests()">View Join Requests</button>
  <div id="joinRequests"></div>

<h2>Create Campaign</h2>

<input id="campaignName" placeholder="Campaign Name">
<input id="campaignDM" placeholder="DM Name">
<input id="campaignDescription" placeholder="Description">

<button onclick="createCampaign()">Create Campaign</button>

<h2>Campaign Control</h2>

<select id="dmCampaignSelect"
onchange="loadJoinRequests()"
loadPlayerList();">
  <option>Loading campaigns...</option>
</select>

  <h2>Item Control</h2>

  <select id="itemSelect">
    <option>Loading items...</option>
  </select>

  <h2>Create Custom Item </h2>

  <input id="ItemName" placeholder="Item Name">
  <input id="ItemType" placeholder="Type: Weapon, Potion, armor">
  <input id="ItemDescription" placeholder="Item Description">
  <input id="ItemDamage" placeholder="Damage" type="number">
  <input id="ItemHeal" placeholder="Heal" type="number">

  <button onclick="createCustomItem()">Create Custom Item</button>
  <button onclick="createNewItem()">Create Item</button>
  <button onclick="giveSelectedItem()">Give Selected Item</button>
  <button onclick="removeSelectedItem()">Remove Selected Item</button>

  <pre id="output"></pre>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    socket.on("connect", () => {
      console.log("DM dashboard connected to server");
    });
    async function damagePlayer() {
      const playerId = document.getElementById("playerSelect").value;
      const res = await fetch(`/damage/${playerId}/5`);
      const data = await res.json();
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    }

    async function healPlayer() {
      const playerId = document.getElementById("playerSelect").value;
      const res = await fetch(`/heal/${playerId}/5`);
      const data = await res.json();
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    }

    async function loadPlayers() {
      const res = await fetch("/players");
      const data = await res.json();
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    }

    async function loadItems() {
  const res = await fetch("/items");
  const items = await res.json();

  const itemSelect = document.getElementById("itemSelect");
  itemSelect.innerHTML = "";

  items.forEach(item => {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = `${item.name} (${item.type})`;
    itemSelect.appendChild(option);
  });
}

async function loadCampaigns() {
  const res = await fetch("/campaigns");
  const campaigns = await res.json();

  const select =
    document.getElementById("dmCampaignSelect");

  select.innerHTML = "";

  campaigns.forEach(campaign => {

    const option =
      document.createElement("option");

    option.value = campaign.id;

    option.textContent =
      `${campaign.name} - DM: ${campaign.dm}`;

    select.appendChild(option);

  });
}

async function giveSelectedItem() {
  const playerId = document.getElementById("playerSelect").value;
  const itemId = document.getElementById("itemSelect").value;

  const res = await fetch(`/giveitem/${playerId}/${itemId}`);
  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}

async function removeSelectedItem() {
  const playerId = document.getElementById("playerSelect").value;
  const itemId = document.getElementById("itemSelect").value;

  const res = await fetch(`/removeitem/${playerId}/${itemId}`);
  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}

async function loadPlayerList() {

    const res = await fetch("/players");

    const players = await res.json();
    const selectedCampaignId = document.getElementById("dmCampaignSelect").value;
    
    const filteredPlayers = players.filter(p => p.campaignId === selectedCampaignId);

    const playerSelect =
        document.getElementById("playerSelect");

    playerSelect.innerHTML = "";

    filteredPlayers.forEach(player => {

        const option =
            document.createElement("option");

        option.value = player.id;

        option.textContent =
            player.name;

        playerSelect.appendChild(option);

    });

}

async function createCustomItem() {
  const name = document.getElementById("ItemName").value;
  const type = document.getElementById("ItemType").value;
  const description = document.getElementById("ItemDescription").value;
  const damage = parseInt(document.getElementById("ItemDamage").value) || 0;
  const heal = parseInt(document.getElementById("ItemHeal").value) || 0;

  const res = await fetch("/createitem", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, type, description, damage, heal })
  });
  const data = await res.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
  await loadItems();
}

async function loadJoinRequests() {
  const res = await fetch("/joinrequests");
  const requests = await res.json();

  const selectedCampaignId = document.getElementById("dmCampaignSelect").value;

  const filteredRequests = requests.filter(r => r.campaignId === selectedCampaignId);

  const box = document.getElementById("joinRequests");
  box.innerHTML = "";

  filteredRequests.forEach(request => {
    const div = document.createElement("div");

    div.innerHTML = `
      <p>${request.name} - ${request.class}</p>
      <button onclick="approveJoin('${request.id}')">Approve</button>
      <button onclick="denyJoin('${request.id}')">Deny</button>
    `;

    box.appendChild(div);
  });
}

async function createCampaign() {
  const newCampaign = {
    name: document.getElementById("campaignName").value,
    dm: document.getElementById("campaignDM").value,
    description: document.getElementById("campaignDescription").value
  };

  const res = await fetch("/createcampaign", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(newCampaign)
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadCampaigns();
}

async function approveJoin(requestId) {
  const res = await fetch("/approvejoin", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ requestId: requestId })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadJoinRequests();
  await loadPlayerList();
}

async function denyJoin(requestId) {
  const res = await fetch("/denyjoin", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ requestId: requestId })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadJoinRequests();
}

async function removeSelectedPlayer() {
  const playerId = document.getElementById("playerSelect").value;

  const res = await fetch("/removeplayer", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ playerId: playerId })
  });

  const data = await res.json();

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);

  await loadPlayerList();
}


loadItems();
loadPlayerList();
loadJoinRequests();
loadCampaigns();

  </script>
</body>
</html>
